<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowBlue" cx="50%" cy="0%" r="80%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowCyan" cx="90%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowViolet" cx="10%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradients (Cyan -> Royal Blue -> Indigo) -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 10px;
    }
    .brand-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Deep Obsidian Slate Canvas Base -->
  <rect width="1200" height="420" rx="20" fill="#070A12"/>

  <!-- Subtle Cyber Tech Grid -->
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>

  <!-- Ambient Ambient Lighting Flares (Cyan, Blue & Violet) -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGlowBlue)"/>
  <rect width="1200" height="420" rx="20" fill="url(#bgGlowCyan)"/>
  <rect width="1200" height="420" rx="20" fill="url(#bgGlowViolet)"/>

  <!-- Outer Border Frame with Glowing Stroke -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="18.5" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Laser Beam Top Accent Line -->
  <line x1="350" y1="2" x2="850" y2="2" stroke="url(#logoGrad)" stroke-width="3" filter="url(#softGlow)"/>

  <!-- Floating Tech Corner Accents -->
  <path d="M 28 44 L 28 28 L 44 28" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M 1172 44 L 1172 28 L 1156 28" stroke="#818CF8" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M 28 376 L 28 392 L 44 392" stroke="#6366F1" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M 1172 376 L 1172 392 L 1156 392" stroke="#0EA5E9" stroke-width="2.5" fill="none" opacity="0.85"/>

  <!-- Top Pill: Next-Gen SaaS Platform Badge -->
  <g transform="translate(485, 42)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#0E1726" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#38BDF8" filter="url(#softGlow)"/>
    <text x="30" y="18" fill="#7DD3FC" class="badge-text">✦ NEXT-GEN SAAS SUITE</text>
  </g>

  <!-- Central Brand Symbol & Veyrix Title -->
  <g transform="translate(600, 142)">
    <!-- Brand Logo Icon: Futuristic Lightning Hexagon -->
    <g transform="translate(-185, -52)" filter="url(#boltShadow)">
      <!-- Hexagon Shield Background -->
      <polygon points="36,4 66,20 66,56 36,72 6,56 6,20" fill="#0C1527" stroke="url(#logoGrad)" stroke-width="2"/>
      <!-- Lightning Bolt Glyph -->
      <path d="M 40 18 L 24 38 L 35 38 L 30 58 L 48 34 L 37 34 Z" fill="url(#logoGrad)"/>
    </g>

    <!-- Main Title Typography -->
    <text x="-100" y="4" fill="url(#textGrad)" class="brand-title">VEYRIX</text>
  </g>

  <!-- Tagline: "Build beyond limits." -->
  <text x="600" y="210" text-anchor="middle" fill="#F8FAFC" class="brand-tagline">
    Build beyond limits<tspan fill="#38BDF8">.</tspan>
  </text>

  <!-- Subheadline -->
  <text x="600" y="242" text-anchor="middle" fill="#94A3B8" class="brand-sub">
    Enterprise Project Telemetry • Real-Time Task Workflows • Team RBAC • Interactive Analytics
  </text>

  <!-- Horizontal Tech Divider -->
  <line x1="300" y1="272" x2="900" y2="272" stroke="#334155" stroke-opacity="0.6" stroke-dasharray="4 6"/>

  <!-- Bottom Interactive Metric & Tech Badges (Glassmorphism Cards) -->
  <g transform="translate(150, 305)">
    <!-- Pill 1: Next.js 16 + React 19 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="20" y="28" fill="#FFFFFF" font-size="10" font-weight="900">N</text>
      <text x="42" y="24" fill="#F1F5F9" class="pill-text">Next.js 16.4</text>
      <text x="42" y="38" fill="#64748B" font-size="11">React 19 • App Router</text>
    </g>

    <!-- Pill 2: Supabase PostgreSQL + RLS -->
    <g transform="translate(230, 0)">
      <rect width="210" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <path d="M 24 16 L 16 28 L 23 28 L 22 34 L 30 22 L 23 22 Z" fill="#3ECF8E"/>
      <text x="42" y="24" fill="#F1F5F9" class="pill-text">Supabase + RLS</text>
      <text x="42" y="38" fill="#64748B" font-size="11">PostgreSQL &amp; Auth</text>
    </g>

    <!-- Pill 3: Tailwind CSS v4 & Radix -->
    <g transform="translate(470, 0)">
      <rect width="200" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#0EA5E9" fill-opacity="0.2"/>
      <path d="M 18 24 C 20 20, 24 20, 26 24 C 28 28, 30 28, 31 24" stroke="#38BDF8" stroke-width="2" fill="none"/>
      <text x="42" y="24" fill="#F1F5F9" class="pill-text">Tailwind CSS v4</text>
      <text x="42" y="38" fill="#64748B" font-size="11">Radix UI &amp; Lucide</text>
    </g>

    <!-- Pill 4: Hybrid Architecture -->
    <g transform="translate(700, 0)">
      <rect width="200" height="48" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="#0284C7" fill-opacity="0.2"/>
      <text x="18" y="28" fill="#38BDF8" font-size="12">⚡</text>
      <text x="42" y="24" fill="#E0F2FE" class="pill-text">Hybrid Mode</text>
      <text x="42" y="38" fill="#94A3B8" font-size="11">Live DB + Demo Mode</text>
    </g>
  </g>

  <!-- Bottom Ambient Glow Dots -->
  <circle cx="600" cy="415" r="40" fill="#0284C7" fill-opacity="0.25" filter="url(#glowFilter)"/>
</svg>
